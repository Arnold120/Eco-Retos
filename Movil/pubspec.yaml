name: eco_reto
description: Eco-Retos - Plataforma educativa ambiental para estudiantes nicaragüenses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.18.0-18.0.pre.54"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Network
  dio: ^5.7.0

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.1
  equatable: ^2.0.7

  # Auth
  jwt_decoder: ^2.0.1

  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  video_player: ^2.9.2

  model_viewer_plus: ^1.9.3
  video_compress: ^3.1.4
  media_store_plus: ^0.1.3

  # Notifications
  flutter_local_notifications: ^19.4.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  permission_handler: ^11.3.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/plants/
    - assets/objetos_jardin/
    - assets/images/
    - assets/sounds/notificacion.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/EcoReto.png"
